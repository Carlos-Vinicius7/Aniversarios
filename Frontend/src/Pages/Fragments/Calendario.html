<!-- Fragment: Calendário -->
<div class="fragment-header d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1>Calendário</h1>
        <p class="mb-0">Visualize todos os aniversários no calendário</p>
    </div>
</div>

<!-- Calendário Completo -->
<div class="calendar-wrapper fragment-card mb-4">
    <div class="calendar-header">
        <button class="calendar-nav-btn" id="cal-prev"><i class="bi bi-chevron-left"></i></button>
        <h4 id="cal-titulo">Carregando...</h4>
        <button class="calendar-nav-btn" id="cal-next"><i class="bi bi-chevron-right"></i></button>
    </div>
    
    <div class="calendar-grid" id="cal-grid">
        <!-- Dias da semana -->
        <div class="calendar-day-header">Dom</div>
        <div class="calendar-day-header">Seg</div>
        <div class="calendar-day-header">Ter</div>
        <div class="calendar-day-header">Qua</div>
        <div class="calendar-day-header">Qui</div>
        <div class="calendar-day-header">Sex</div>
        <div class="calendar-day-header">Sáb</div>
        <!-- Dias do mês preenchidos via JS -->
    </div>
</div>

<section class="fragment-card mb-4" id="cal-dia-detalhes" hidden aria-live="polite">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0" id="cal-dia-titulo">Detalhes do dia</h5>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="cal-dia-fechar">Fechar</button>
    </div>
    <div class="row g-4">
        <div class="col-lg-6">
            <h6>Aniversários</h6>
            <div id="cal-dia-aniversarios"></div>
        </div>
        <div class="col-lg-6">
            <h6>Notas salvas nesse dia</h6>
            <div id="cal-dia-notas"></div>
        </div>
    </div>
    <p class="text-muted mb-0 mt-3" id="cal-dia-vazio" hidden>Nenhum aniversário ou nota registrada neste dia.</p>
</section>

<div class="row g-4">
    <div class="col-lg-6">
        <div class="fragment-card h-100">
            <h5><i class="bi bi-calendar3 me-2" style="color: var(--accent-purple);"></i>Aniversários do Mês - <span id="cal-mes-titulo"></span></h5>
            <div id="cal-lista-mes" class="mt-3">
                <!-- Preenchido via JS -->
            </div>
            <div id="cal-lista-mes-vazio" class="text-center text-muted py-4" style="display: none;">
                Nenhum aniversário neste mês.
            </div>
        </div>
    </div>

    <div class="col-lg-6">
        <div class="fragment-card h-100">
            <h5><i class="bi bi-bar-chart me-2" style="color: var(--accent-purple);"></i>Resumo por Mês</h5>
            <div class="row g-2 mt-2" id="cal-resumo-meses">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>
</div>
