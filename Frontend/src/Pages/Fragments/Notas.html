
<!-- Fragment: Notas -->
<div class="fragment-header mb-4">
    <h1>Notas</h1>
    <p class="mb-0">Anote ideias de presentes e lembretes pessoais — escolha o dia em que a nota deve aparecer no calendário</p>
</div>

<div class="notas-container">
    <!-- Left Sidebar: Lista de Notas -->
    <div class="notas-sidebar" id="lista-notas">
        <div id="no-notas-msg" class="text-center text-muted mt-5" style="font-size: 0.9rem;">
            <i class="bi bi-journal-x" style="font-size: 2rem; color: var(--text-muted); display: block; margin-bottom: 10px;"></i>
            Nenhuma nota cadastrada.
        </div>
    </div>

    <!-- Right Main Area: Editor da Nota -->
    <div class="notas-main fragment-card p-4">
        <!-- Área de Conteúdo do Editor -->
        <div class="editor-content-area flex-grow-1">
            <form id="form-nova-nota">
                <input type="hidden" id="nota-id">
                <input type="text" id="nota-titulo" class="form-control mb-2" style="border: none; font-size: 1.5rem; font-weight: 600; background: transparent; box-shadow: none;" placeholder="Título da Nota" required>

                <div class="d-flex align-items-center gap-2 mb-3" id="nota-data-wrapper">
                    <i class="bi bi-calendar-event" style="color: var(--accent-purple);"></i>
                    <label for="nota-data" class="mb-0 me-1" style="font-size: 0.85rem; color: var(--text-body);">Nota para o dia:</label>
                    <input type="date" id="nota-data" class="form-control form-control-sm" style="max-width: 170px;" required>
                </div>

                <textarea id="nota-conteudo" class="form-control mb-3" style="border: none; resize: none; min-height: 260px; background: transparent; font-size: 0.95rem; box-shadow: none;" placeholder="Escreva o conteúdo da sua nota aqui..." required></textarea>
                
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary d-none" id="btn-cancelar-edicao-nota">Cancelar</button>
                    <button type="submit" class="btn" id="btn-salvar-nota" style="background-color: var(--accent-purple); color: var(--text-light); border-radius: 8px;">
                        <i class="bi bi-save me-2"></i>Salvar Nota
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
