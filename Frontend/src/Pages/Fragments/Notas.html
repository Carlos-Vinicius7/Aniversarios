
<!-- Fragment: Notas -->
<div class="fragment-header d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
    <div class="mb-3 mb-md-0">
        <h1>Notas</h1>
        <p class="mb-0">Anote ideias de presentes e lembretes pessoais</p>
    </div>
    <button class="btn px-4 py-2" id="btn-nova-nota" style="background-color: var(--accent-purple); color: var(--text-light); border-radius: 12px; font-family: 'Outfit', sans-serif; font-weight: 500;">
        <i class="bi bi-plus-lg me-2"></i>Nova Nota
    </button>
</div>

<div class="notas-container">
    <!-- Left Sidebar: Lista de Notas -->
    <div class="notas-sidebar" id="lista-notas">
        <div id="no-notas-msg" class="text-center text-muted mt-5" style="font-size: 0.9rem;">
            <i class="bi bi-journal-x" style="font-size: 2rem; color: var(--text-muted); display: block; margin-bottom: 10px;"></i>
            Nenhuma nota cadastrada.
        </div>
    </div>

    <!-- Right Main Area: Editor da Nota -->
    <div class="notas-main fragment-card p-4">
        <!-- Área de Conteúdo do Editor -->
        <div class="editor-content-area flex-grow-1">
            <form id="form-nova-nota">
                <input type="hidden" id="nota-id">
                <input type="text" id="nota-titulo" class="form-control mb-3" style="border: none; font-size: 1.5rem; font-weight: 600; background: transparent; box-shadow: none;" placeholder="Título da Nota" required>
                
                <textarea id="nota-conteudo" class="form-control mb-3" style="border: none; resize: none; min-height: 280px; background: transparent; font-size: 0.95rem; box-shadow: none;" placeholder="Escreva o conteúdo da sua nota aqui..." required></textarea>
                
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary d-none" id="btn-cancelar-edicao-nota">Cancelar</button>
                    <button type="submit" class="btn" id="btn-salvar-nota" style="background-color: var(--accent-purple); color: var(--text-light); border-radius: 8px;">
                        <i class="bi bi-save me-2"></i>Salvar Nota
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
