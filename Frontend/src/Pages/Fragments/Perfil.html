<!-- Fragment: Perfil -->
<div class="fragment-header">
    <h1>Perfil</h1>
    <p>Gerencie suas informações pessoais</p>
</div>

<div class="row g-4">
    <div class="col-lg-4">
        <div class="fragment-card text-center">
            <div class="mb-3 profile-avatar">
                <i class="bi bi-person"></i>
            </div>
            <h5 class="profile-name" id="perfil-display-nome">—</h5>
            <p class="text-muted profile-email" id="perfil-display-email">—</p>
            <span class="badge px-3 py-2 profile-status-badge">
                <i class="bi bi-patch-check me-1"></i>Conta Ativa
            </span>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="fragment-card">
            <h5><i class="bi bi-pencil-square me-2 info-icon"></i>Informações da Conta</h5>
            <form class="mt-3" id="form-perfil">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="perfil-nome" class="form-label form-label-custom">Nome completo</label>
                        <input type="text" id="perfil-nome" class="form-control form-control-custom" placeholder="Seu nome completo" maxlength="200" required>
                    </div>
                    <div class="col-md-6">
                        <label for="perfil-email" class="form-label form-label-custom">E-mail</label>
                        <input type="email" id="perfil-email" class="form-control form-control-custom" placeholder="seu@email.com" maxlength="50" required>
                    </div>
                    <div class="col-md-6">
                        <label for="perfil-telefone" class="form-label form-label-custom">Telefone</label>
                        <input type="tel" id="perfil-telefone" class="form-control form-control-custom" placeholder="(00) 00000-0000" maxlength="20">
                    </div>
                    <div class="col-md-6">
                        <label for="perfil-nascimento" class="form-label form-label-custom">Data de nascimento</label>
                        <input type="date" id="perfil-nascimento" class="form-control form-control-custom">
                    </div>
                </div>
                <button type="submit" class="btn mt-4 px-4 py-2 btn-save-changes" id="btn-salvar-perfil">
                    <i class="bi bi-check-lg me-2"></i>Salvar Alterações
                </button>
                <span id="perfil-msg-salvo" class="ms-3 text-success" role="status" hidden>
                    <i class="bi bi-check-circle me-1"></i>Salvo com sucesso!
                </span>
                <span id="perfil-msg-erro" class="ms-3 text-danger" role="alert" hidden></span>
            </form>
        </div>
    </div>
</div>

<div class="fragment-card mt-4">
    <h5><i class="bi bi-gear me-2 info-icon"></i>Preferências</h5>
    <div class="row g-3 mt-1">
        <div class="col-md-6">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="notifEmail">
                <label class="form-check-label pref-label" for="notifEmail">Notificações por e-mail</label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="notifPush">
                <label class="form-check-label pref-label" for="notifPush">Notificações push</label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="lembrete3dias">
                <label class="form-check-label pref-label" for="lembrete3dias">Lembrete 3 dias antes</label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="lembreteNoDia">
                <label class="form-check-label pref-label" for="lembreteNoDia">Lembrete no dia</label>
            </div>
        </div>
    </div>
    <p class="text-danger mt-3 mb-0" id="preferencias-msg-erro" role="alert" hidden></p>
</div>
