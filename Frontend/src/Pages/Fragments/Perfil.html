<!-- Fragment: Perfil -->
<div class="fragment-header">
    <h1>Perfil</h1>
    <p>Gerencie suas informações pessoais</p>
</div>

<div class="row g-4">
    <!-- Card de Perfil -->
    <div class="col-lg-4">
        <div class="fragment-card text-center">
            <div class="mb-3 profile-avatar">
                <i class="bi bi-person"></i>
            </div>
            <h5 class="profile-name">Carlos Vinícius</h5>
            <p class="text-muted profile-email">carlos@email.com</p>
            <span class="badge px-3 py-2 profile-status-badge">
                <i class="bi bi-patch-check me-1"></i>Conta Ativa
            </span>
        </div>
    </div>

    <!-- Card de Informações -->
    <div class="col-lg-8">
        <div class="fragment-card">
            <h5><i class="bi bi-pencil-square me-2 info-icon"></i>Informações da Conta</h5>
            <form class="mt-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label form-label-custom">Nome completo</label>
                        <input type="text" class="form-control form-control-custom" value="Carlos Vinícius">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label form-label-custom">E-mail</label>
                        <input type="email" class="form-control form-control-custom" value="carlos@email.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label form-label-custom">Telefone</label>
                        <input type="tel" class="form-control form-control-custom" value="(11) 99999-9999">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label form-label-custom">Data de nascimento</label>
                        <input type="date" class="form-control form-control-custom" value="1998-05-15">
                    </div>
                </div>
                <button type="submit" class="btn mt-4 px-4 py-2 btn-save-changes">
                    <i class="bi bi-check-lg me-2"></i>Salvar Alterações
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Card de Preferências -->
<div class="fragment-card mt-4">
    <h5><i class="bi bi-gear me-2 info-icon"></i>Preferências</h5>
    <div class="row g-3 mt-1">
        <div class="col-md-6">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="notifEmail" checked>
                <label class="form-check-label pref-label" for="notifEmail">
                    Notificações por e-mail
                </label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="notifPush" checked>
                <label class="form-check-label pref-label" for="notifPush">
                    Notificações push
                </label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="lembrete3dias" checked>
                <label class="form-check-label pref-label" for="lembrete3dias">
                    Lembrete 3 dias antes
                </label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="lembreteNoDia">
                <label class="form-check-label pref-label" for="lembreteNoDia">
                    Lembrete no dia
                </label>
            </div>
        </div>
    </div>
</div>
