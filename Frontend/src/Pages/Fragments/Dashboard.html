<!-- Fragment: Dashboard -->
<div class="fragment-header">
    <h1>Dashboard</h1>
    <p>Visão geral do sistema de controle de aniversários</p>
</div>

<!-- Stat Cards -->
<div class="row g-4 mb-4">
    <div class="col-lg-3 col-md-6">
        <div class="stat-card">
            <div class="stat-icon"><i class="bi bi-gift"></i></div>
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">Aniversários cadastrados</div>
        </div>
    </div>
    <div class="col-lg-3 col-md-6">
        <div class="stat-card">
            <div class="stat-icon"><i class="bi bi-calendar-event"></i></div>
            <div class="stat-value" id="stat-semana">0</div>
            <div class="stat-label">Esta semana</div>
        </div>
    </div>
    <div class="col-lg-3 col-md-6">
        <div class="stat-card">
            <div class="stat-icon"><i class="bi bi-journal-text"></i></div>
            <div class="stat-value" id="stat-notas">0</div>
            <div class="stat-label">Notas criadas</div>
        </div>
    </div>
    <div class="col-lg-3 col-md-6">
        <div class="stat-card">
            <div class="stat-icon"><i class="bi bi-people"></i></div>
            <div class="stat-value" id="stat-grupos">0</div>
            <div class="stat-label">Grupos</div>
        </div>
    </div>
</div>

<!-- Próximos Aniversários -->
<div class="fragment-card">
    <h5><i class="bi bi-cake2 me-2 dashboard-icon-title"></i>Próximos Aniversários</h5>
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th class="dashboard-table-header">Nome</th>
                    <th class="dashboard-table-header">Data</th>
                    <th class="dashboard-table-header">Idade</th>
                    <th class="dashboard-table-header">Dias restantes</th>
                </tr>
            </thead>
            <tbody id="dashboard-proximos-tbody">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>
    <div id="dashboard-proximos-vazio" class="text-center text-muted py-4" style="display: none;">
        <i class="bi bi-gift" style="font-size: 2rem; display: block; margin-bottom: 8px;"></i>
        Nenhum aniversário cadastrado ainda.
    </div>
</div>

<!-- Atividade Recente -->
<div class="fragment-card">
    <h5><i class="bi bi-clock-history me-2 dashboard-icon-title"></i>Atividade Recente</h5>
    <ul class="list-unstyled mb-0" id="dashboard-atividades">
        <!-- Preenchido via JS -->
    </ul>
    <div id="dashboard-atividades-vazio" class="text-center text-muted py-4" style="display: none;">
        <i class="bi bi-clock-history" style="font-size: 2rem; display: block; margin-bottom: 8px;"></i>
        Nenhuma atividade recente.
    </div>
</div>
