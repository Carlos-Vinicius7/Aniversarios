<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Agenda de Aniversários</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../CSS/pages/Login/Login.css">
</head>
<body>
    <main class="pagina-autenticacao">
        <section class="area-marca">
            <a class="link-inicio" href="../../../../index.html">
                <i class="bi bi-arrow-left"></i> Voltar para o início
            </a>
            <div class="marca">
                <i class="bi bi-cake2"></i>
                <h1>Agenda de Aniversários</h1>
            </div>
        </section>

        <section class="area-formulario">
            <div class="cartao-formulario">
                <div id="login-container">
                    <h2>Bem-vindo de volta</h2>
                    <p class="texto-auxiliar">Acesse sua conta para continuar.</p>
                    <form class="formulario-login">
                        <label class="grupo-campo">
                            <i class="bi bi-envelope"></i>
                            <input type="email" name="email" placeholder="Seu e-mail" autocomplete="email" maxlength="50" required>
                        </label>
                        <label class="grupo-campo">
                            <i class="bi bi-lock"></i>
                            <input type="password" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
                        </label>
                        <button class="botao-enviar" type="submit">Entrar</button>
                    </form>
                    <p class="texto-auxiliar" id="login-error" role="alert" hidden></p>
                    <p class="texto-auxiliar">Ainda não tem uma conta? <a href="#cadastro" id="link-to-cadastro">Cadastre-se</a></p>
                </div>

                <div id="cadastro-container" style="display: none;">
                    <h2>Crie sua conta</h2>
                    <p class="texto-auxiliar">Organize as datas especiais em um só lugar.</p>
                    <form class="formulario-cadastro">
                        <label class="grupo-campo">
                            <i class="bi bi-person"></i>
                            <input type="text" name="nome" placeholder="Seu nome" autocomplete="name" required>
                        </label>
                        <label class="grupo-campo">
                            <i class="bi bi-envelope"></i>
                            <input type="email" name="email" placeholder="Seu e-mail" autocomplete="email" maxlength="50" required>
                        </label>
                        <label class="grupo-campo">
                            <i class="bi bi-lock"></i>
                            <input type="password" name="senha" placeholder="Crie uma senha" autocomplete="new-password" minlength="8" required>
                        </label>
                        <button class="botao-enviar" type="submit">Criar conta</button>
                    </form>
                    <p class="texto-auxiliar" id="cadastro-error" role="alert" hidden></p>
                    <p class="texto-auxiliar">Já tem uma conta? <a href="#entrar" id="link-to-login">Entrar</a></p>
                </div>
            </div>
        </section>
    </main>

    <script src="../../JavaScript/AppData.js"></script>
    <script src="../../JavaScript/pages/Login/login.js"></script>
</body>
</html>
